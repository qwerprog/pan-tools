<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 200" width="840" height="200" role="img" aria-label="pan-tools (pant) - Baidu Netdisk CLI &amp; TUI">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="55%" stop-color="#131926"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="panGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22D3EE"/>
      <stop offset="50%" stop-color="#61AFEF"/>
      <stop offset="100%" stop-color="#C084FC"/>
    </linearGradient>
    <linearGradient id="cloudStroke" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22D3EE"/>
      <stop offset="50%" stop-color="#528BFF"/>
      <stop offset="100%" stop-color="#C084FC"/>
    </linearGradient>
    <radialGradient id="glowCyan" cx="20%" cy="45%" r="40%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowPurple" cx="85%" cy="55%" r="45%">
      <stop offset="0%" stop-color="#A78BFA" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#A78BFA" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Card Background -->
  <rect x="1" y="1" width="838" height="198" rx="16" fill="url(#bgGrad)" stroke="#30363d" stroke-width="1.5"/>
  <rect x="1" y="1" width="838" height="198" rx="16" fill="url(#glowCyan)"/>
  <rect x="1" y="1" width="838" height="198" rx="16" fill="url(#glowPurple)"/>

  <!-- Terminal Window Dots -->
  <circle cx="26" cy="22" r="5" fill="#ff5f56" opacity="0.85"/>
  <circle cx="44" cy="22" r="5" fill="#ffbd2e" opacity="0.85"/>
  <circle cx="62" cy="22" r="5" fill="#27c93f" opacity="0.85"/>

  <!-- Cloud Drive Icon -->
  <g transform="translate(52, 36)">
    <!-- Outer Cloud Frame -->
    <path d="M 34.00 97.00 A 24.00 24.00 0 0 1 31.08 49.18 A 31.00 31.00 0 1 1 92.71 51.24 A 23.00 23.00 0 1 1 96.00 97.00 Z" fill="#161b22" stroke="url(#cloudStroke)" stroke-width="4.5" stroke-linejoin="round"/>
    <!-- Inner Cloud Recess -->
    <path d="M 34.00 90.50 A 17.50 17.50 0 1 1 39.35 56.34 A 24.50 24.50 0 1 1 81.96 62.85 A 16.50 16.50 0 1 1 96.00 90.50 Z" fill="#0d1117" stroke="#30363d" stroke-width="1.5" stroke-linejoin="round"/>

    <!-- Upload Arrow (Left, Cyan) -->
    <g stroke="#22D3EE" stroke-width="4.2" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <line x1="53" y1="78" x2="53" y2="52"/>
      <polyline points="45,60 53,51.5 61,60"/>
    </g>

    <!-- Download Arrow (Right, Violet) -->
    <g stroke="#C084FC" stroke-width="4.2" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <line x1="76" y1="51.5" x2="76" y2="77.5"/>
      <polyline points="68,69.5 76,78 84,69.5"/>
    </g>

    <!-- Bottom Transfer Speed Bar -->
    <rect x="28" y="108" width="73" height="7" rx="3.5" fill="#21262d" stroke="#30363d" stroke-width="1.2"/>
    <rect x="29.5" y="109.5" width="47" height="4" rx="2" fill="url(#panGrad)"/>
    <circle cx="95" cy="111.5" r="2" fill="#3FB950"/>
  </g>

  <!-- Pixel Title: PAN-TOOLS (5x5 pixel font, unit=7, cell=6, rx=1.2) -->
  <g transform="translate(220, 44)" fill="url(#panGrad)">
    <!-- P (x=0, w=27) -->
    <rect x="0" y="0" width="20" height="6" rx="1.2"/>
    <rect x="0" y="7" width="6" height="6" rx="1.2"/><rect x="21" y="7" width="6" height="6" rx="1.2"/>
    <rect x="0" y="14" width="20" height="6" rx="1.2"/>
    <rect x="0" y="21" width="6" height="13" rx="1.2"/>

    <!-- A (x=36, w=27) -->
    <rect x="43" y="0" width="13" height="6" rx="1.2"/>
    <rect x="36" y="7" width="6" height="6" rx="1.2"/><rect x="57" y="7" width="6" height="6" rx="1.2"/>
    <rect x="36" y="14" width="27" height="6" rx="1.2"/>
    <rect x="36" y="21" width="6" height="13" rx="1.2"/><rect x="57" y="21" width="6" height="13" rx="1.2"/>

    <!-- N (x=72, w=34) -->
    <rect x="72" y="0" width="6" height="34" rx="1.2"/>
    <rect x="79" y="7" width="6" height="6" rx="1.2"/>
    <rect x="86" y="14" width="6" height="6" rx="1.2"/>
    <rect x="93" y="21" width="6" height="6" rx="1.2"/>
    <rect x="100" y="0" width="6" height="34" rx="1.2"/>

    <!-- - (x=115, w=18) -->
    <rect x="115" y="14" width="18" height="6" rx="1.2"/>

    <!-- T (x=142, w=27) -->
    <rect x="142" y="0" width="27" height="6" rx="1.2"/>
    <rect x="152.5" y="7" width="6" height="27" rx="1.2"/>

    <!-- O (x=178, w=27) -->
    <rect x="185" y="0" width="13" height="6" rx="1.2"/>
    <rect x="178" y="7" width="6" height="20" rx="1.2"/>
    <rect x="199" y="7" width="6" height="20" rx="1.2"/>
    <rect x="185" y="28" width="13" height="6" rx="1.2"/>

    <!-- O (x=214, w=27) -->
    <rect x="221" y="0" width="13" height="6" rx="1.2"/>
    <rect x="214" y="7" width="6" height="20" rx="1.2"/>
    <rect x="235" y="7" width="6" height="20" rx="1.2"/>
    <rect x="221" y="28" width="13" height="6" rx="1.2"/>

    <!-- L (x=250, w=24) -->
    <rect x="250" y="0" width="6" height="27" rx="1.2"/>
    <rect x="250" y="28" width="24" height="6" rx="1.2"/>

    <!-- S (x=283, w=27) -->
    <rect x="290" y="0" width="20" height="6" rx="1.2"/>
    <rect x="283" y="7" width="6" height="6" rx="1.2"/>
    <rect x="290" y="14" width="13" height="6" rx="1.2"/>
    <rect x="304" y="21" width="6" height="6" rx="1.2"/>
    <rect x="283" y="28" width="20" height="6" rx="1.2"/>

    <!-- Command Badge `pant` -->
    <g transform="translate(330, 4)">
      <rect x="0" y="0" width="56" height="26" rx="7" fill="#21262d" stroke="#30363d" stroke-width="1.2"/>
      <text x="28" y="18" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="15" font-weight="700" fill="#38BDF8">pant</text>
    </g>
  </g>

  <!-- Subtitle -->
  <text x="220" y="108" font-family="ui-sans-serif, system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="500" fill="#e6edf3">
    Baidu Netdisk CLI &amp; TUI · 现代百度网盘终端工具箱
  </text>

  <!-- Feature Pills -->
  <g transform="translate(220, 128)" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="600">
    <rect x="0" y="0" width="48" height="24" rx="12" fill="#C084FC" fill-opacity="0.14" stroke="#C084FC" stroke-opacity="0.45"/>
    <text x="24" y="16" text-anchor="middle" fill="#C084FC">TUI</text>

    <rect x="56" y="0" width="84" height="24" rx="12" fill="#61AFEF" fill-opacity="0.14" stroke="#61AFEF" stroke-opacity="0.45"/>
    <text x="98" y="16" text-anchor="middle" fill="#61AFEF">Download</text>

    <rect x="148" y="0" width="70" height="24" rx="12" fill="#3FB950" fill-opacity="0.14" stroke="#3FB950" stroke-opacity="0.45"/>
    <text x="183" y="16" text-anchor="middle" fill="#3FB950">Upload</text>

    <rect x="226" y="0" width="86" height="24" rx="12" fill="#E5C07B" fill-opacity="0.14" stroke="#E5C07B" stroke-opacity="0.45"/>
    <text x="269" y="16" text-anchor="middle" fill="#E5C07B">QR Login</text>

    <rect x="320" y="0" width="84" height="24" rx="12" fill="#F0883E" fill-opacity="0.14" stroke="#F0883E" stroke-opacity="0.45"/>
    <text x="362" y="16" text-anchor="middle" fill="#F0883E">Transfer</text>

    <rect x="412" y="0" width="90" height="24" rx="12" fill="#8B949E" fill-opacity="0.14" stroke="#8B949E" stroke-opacity="0.45"/>
    <text x="457" y="16" text-anchor="middle" fill="#c9d1d9">OfflineDL</text>

    <rect x="510" y="0" width="46" height="24" rx="12" fill="#00ADD8" fill-opacity="0.14" stroke="#00ADD8" stroke-opacity="0.45"/>
    <text x="533" y="16" text-anchor="middle" fill="#00ADD8">Go</text>
  </g>
</svg>
